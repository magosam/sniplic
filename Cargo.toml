[package]
name = "sniplic-core"
version = "0.2.363"
edition = "2021"
authors = ["PromptCommando"]
description = "A Rust-based Non-Linear Video Editing (NLE) engine."

[workspace]
members = ["bindings/node"]

[dependencies]
tokio = { version = "1.37", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
uuid = { version = "1.8", features = ["v4"] }
zip = "0.6"
aes-gcm = "0.10"
ed25519-dalek = "2.1"
ort = "2.0.0-rc.13"
hound = "3.5.1"

# tauri = { version = "2.0" } # Removendo dependência do Tauri
